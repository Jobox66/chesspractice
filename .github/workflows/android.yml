name: android

# Builds the Android APK of the mobile app (mobile/) on GitHub's runners,
# so nothing has to be installed locally. Download it from the run page:
# Actions -> android -> the run -> Artifacts.
#
# Uses the same steps as a local Android Studio build (expo prebuild +
# gradle assembleRelease). The release APK is signed with the debug
# keystore shipped in Expo's template, so APKs from here and from a local
# build install over each other.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EXPO_PUBLIC_FIREBASE_API_KEY  required, same value as the web's VITE_FIREBASE_API_KEY
#   EXPO_PUBLIC_API_URL           optional, defaults to the Render backend URL in src/services/config.ts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: check secrets
        env:
          FIREBASE_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "::error::Missing secret EXPO_PUBLIC_FIREBASE_API_KEY (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      # Same file as a local mobile/.env; read when the JS bundle is built.
      - name: write .env
        env:
          FIREBASE_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          {
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=$FIREBASE_KEY"
            if [ -n "$API_URL" ]; then echo "EXPO_PUBLIC_API_URL=$API_URL"; fi
          } > .env

      - name: install
        run: npm ci

      - name: generate android project
        run: npx expo prebuild -p android --clean

      - uses: gradle/actions/setup-gradle@v4

      # Only real-phone ABIs (no x86 emulators): halves the native build time.
      - name: build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: name APK
        run: |
          version=$(node -p "require('./app.json').expo.version")
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/chesspractice-${version}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: chesspractice-apk
          path: mobile/dist-apk/*.apk
          retention-days: 30
          if-no-files-found: error
