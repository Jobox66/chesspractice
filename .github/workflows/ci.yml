name: ci

# Deploys are handled by the hosts themselves: Render (backend) and
# Vercel (frontend) both auto-deploy on push to main. This workflow only
# checks that the code builds and tests pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: test
        working-directory: backend
        run: go test ./...
      - name: explorer vet + test
        working-directory: explorer
        run: |
          go vet ./...
          go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: install
        working-directory: mobile
        run: npm ci
      - name: typecheck
        working-directory: mobile
        run: npx tsc --noEmit
